[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etna-mcp"
version = "1.0.0b28"
description = "A lightweight, Docker-free tool server for AI models — extend with drop-in kit files."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "dwhite-sys" }]
keywords = ["mcp", "model context protocol", "llm", "tools", "kit", "claude", "openwebui", "lm studio", "etna"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "requests>=2.31.0",
    "uv>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/dwhite-sys/Etna"
Repository = "https://github.com/dwhite-sys/Etna"
Issues = "https://github.com/dwhite-sys/Etna/issues"

[project.scripts]
etna = "etna.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["etna*"]
