name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python tests/runtime_smoke.py

  publish:
    needs: validate
    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text()
          )["project"]["version"]

          expected = f"v{version}"

          if tag != expected:
              raise SystemExit(
                  f"Tag {tag!r} does not match package version {expected!r}"
              )

          print(f"Publishing etna-mcp {version}")
          PY

      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
